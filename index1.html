  .word-count { font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
  .save-btn { background: linear-gradient(135deg, #f5ddd8, #edcac3); border: none; border-radius: 100px; padding: 7px 18px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 500; color: var(--brown); cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(200,136,128,0.2); }

  /* goals */
  .goal-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }

  .today-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }

  .past-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .past-entry { background: white; border-radius: 18px; padding: 16px 18px; border: 1px solid var(--beige); animation: rise 0.25s ease; }

  .rtodo-txt { flex: 1; font-size: 13px; color: var(--dark); font-weight: 300; cursor: pointer; }
  .rtodo-txt.done { text-decoration: line-through; color: var(--muted); }
  .rdel { background: none; border: none; color: var(--beige2); cursor: pointer; font-size: 16px; opacity: 0; transition: opacity 0.15s; }
  .rtodo-item:hover .rdel { opacity: 1; }
  .rinput-wrap { display: flex; gap: 8px; }
  .back-btn { display: inline-flex; align-items: center; gap: 6px; background: white; border: 1.5px solid var(--beige); border-radius: 100px; padding: 7px 16px; font-size: 12px; color: var(--muted); cursor: pointer; margin-bottom: 20px; transition: all 0.15s; }

  .weather-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }

  .weather-condition { font-size: 11px; color: var(--soft); margin-top: 3px; letter-spacing: 0.02em; }

  .weather-loading { font-size: 11px; color: var(--muted); font-style: italic; text-align: center; padding: 8px 0; }
`;

function getCalDays() {
  const today = new Date();
  const days = [];
  for (let i = -2; i <= 12; i++) { const d = new Date(today); d.setDate(today.getDate() + i); days.push(d); }
  return days;
}

          {view === "restday" && (
            <>
              <button className="back-btn" onClick={() => setView("schedule")}>← back to timetable</button>
              <div className="rest-hero">
                <span className="rest-emoji">🌸</span>
                <div className="rest-title">Sunday <em>Rest Day</em></div>
                <div className="rest-sub">you deserve this — slow down & recharge 🕯️</div>
              </div>
              <div className="rest-grid">
                <div className="card">
                  <div className="card-title">sunday <em>to-do</em></div>
                  <div className="card-sub">gentle things only 🤍</div>
                  <div className="rtodo-list">
                    {restTodos.map(t => (
                      <div key={t.id} className={`rtodo-item ${t.done?"done":""}`}>
                        <div className={`rcheck ${t.done?"on":""}`} onClick={() => setRestTodos(ts => ts.map(x => x.id===t.id?{...x,done:!x.done}:x))}>
                          {t.done && "✓"}
                        </div>
                        <span className={`rtodo-txt ${t.done?"done":""}`} onClick={() => setRestTodos(ts => ts.map(x => x.id===t.id?{...x,done:!x.done}:x))}>{t.text}</span>
                        <button className="rdel" onClick={() => setRestTodos(ts => ts.filter(x => x.id!==t.id))}>×</button>
                      </div>
                    ))}
                  </div>
                  <div className="rinput-wrap">
                    <input className="field" placeholder="add something for sunday..." value={newRestTodo}
                      onChange={e => setNewRestTodo(e.target.value)}
                      onKeyDown={e => { if(e.key==="Enter" && newRestTodo.trim()) { setRestTodos(ts => [...ts, {id:Date.now(), text:newRestTodo, done:false}]); setNewRestTodo(""); }}}
                    />
                    <button className="btn-add" onClick={() => { if(newRestTodo.trim()) { setRestTodos(ts => [...ts, {id:Date.now(), text:newRestTodo, done:false}]); setNewRestTodo(""); }}}>+ add</button>
                  </div>
                </div>

                <div className="card">
                  <div className="card-title">sunday <em>notes</em></div>
                  <div className="card-sub">what do you want this day to feel like? ✦</div>
                  <textarea className="journal-area" style={{minHeight:"220px"}}
                    placeholder="plan your rest day, write your intentions, or just ramble... 🌸"
                    value={restNote} onChange={e => setRestNote(e.target.value)}
                  />
                </div>
              </div>
            </>
          )}

          {/* JOURNAL */}
          {view === "past" && (
            <>
              <div className="page-title">your <em>journal</em> 📖</div>
              <div className="past-grid">
                {entries.length === 0
                  ? <div className="empty-state">no entries yet, love 🌸<br/>start by writing something today</div>
                  : entries.map(e => {
                      const moodData = e.mood !== null ? MOODS[e.mood] : null;
                      return (
                        <div key={e.id} className="past-entry">
                          <div className="past-entry-top">
                            <div className="past-entry-date">{e.date}</div>
                            {moodData && <div className="past-entry-mood">{moodData.emoji}</div>}
                          </div>
                          {e.text && <div className="past-entry-text">{e.text}</div>}
                          {e.acts.length > 0 && (
                            <div className="past-entry-acts">
                              {e.acts.map(a => { const act = ACTS.find(x => x.label===a); return <span key={a} className="past-act">{act?.emoji} {a}</span>; })}
                            </div>
                          )}
                        </div>
                      );
                    })
                }
              </div>
            </>
          )}
        </div>
      </div>
    </>
  );
}
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
